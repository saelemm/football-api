spring:
  application:
    name: football-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/football}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    packages-to-scan: com.foot.adapter.persistence.jpa.entity
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

